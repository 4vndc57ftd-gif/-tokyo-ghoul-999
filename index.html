<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東京喰種 抽選体験機</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
    "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  text-align: center;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 25px 15px 50px;
}

h1 {
  font-size: 30px;
  margin: 10px 0 5px;
  letter-spacing: 3px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 25px;
}

.machine {
  background: linear-gradient(145deg, #181818, #050505);
  border: 2px solid #333;
  border-radius: 20px;
  padding: 25px 18px;
  box-shadow: 0 0 30px rgba(255,0,0,.15);
}

.display {
  background: #020202;
  border: 2px solid #444;
  border-radius: 12px;
  min-height: 180px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  margin-bottom: 20px;
  padding: 20px;
}

.result {
  font-size: 42px;
  font-weight: bold;
  letter-spacing: 4px;
}

.result.normal {
  color: #fff;
}

.result.rare {
  color: #ff3333;
  text-shadow: 0 0 15px red;
}

.result.super {
  color: #ffcc00;
  text-shadow: 0 0 20px #ff6600;
}

.message {
  margin-top: 12px;
  color: #aaa;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 18px;
  border: none;
  border-radius: 12px;
  background: #b40000;
  color: white;
  font-size: 21px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 0 #5c0000;
}

button:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #5c0000;
}

button:disabled {
  background: #444;
  box-shadow: none;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 20px;
}

.stat {
  background: #151515;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 12px 5px;
}

.stat-title {
  color: #888;
  font-size: 12px;
}

.stat-value {
  font-size: 20px;
  font-weight: bold;
  margin-top: 4px;
}

.history {
  margin-top: 25px;
  text-align: left;
}

.history h2 {
  font-size: 18px;
  border-left: 4px solid #b40000;
  padding-left: 10px;
}

.history-list {
  max-height: 250px;
  overflow-y: auto;
  background: #101010;
  border-radius: 10px;
  padding: 10px;
}

.history-item {
  display: flex;
  justify-content: space-between;
  padding: 9px 5px;
  border-bottom: 1px solid #252525;
}

.history-item:last-child {
  border-bottom: none;
}

.rain {
  animation: shake .08s infinite alternate;
}

@keyframes shake {
  from {
    transform: translateX(-2px);
  }
  to {
    transform: translateX(2px);
  }
}

.flash {
  animation: flash .25s alternate 4;
}

@keyframes flash {
  from {
    background: #080808;
  }
  to {
    background: #500000;
  }
}

.note {
  color: #777;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

  <h1>東京喰種</h1>
  <div class="subtitle">抽選体験機</div>

  <div class="machine">

    <div class="display" id="display">

      <div class="result
